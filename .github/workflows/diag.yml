name: diag
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests and keep the output
        run: |
          mkdir -p /tmp/out
          dotnet test tests/Flagpole.Engine.Tests -c Release --logger "console;verbosity=normal" > /tmp/out/result.txt 2>&1 || true
          echo "sha: ${GITHUB_SHA}" >> /tmp/out/result.txt
      - name: Publish the output to the ci-log branch
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git checkout --orphan ci-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/result.txt result.txt
          git add result.txt
          git commit -m "test output"
          git push -f origin ci-log